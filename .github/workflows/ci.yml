name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install uv
      - run: uv sync --extra dev --extra google --extra sqlite
      - run: uv run ruff check src tests
      - run: uv run mypy src
      - run: uv run pytest
